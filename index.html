<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Trait Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one screen. Top bar (name, scenario letters, run controls); dish over trait-frequency graph on the left; conditions and per-variant data in a sidebar. Stacks and scrolls only on phones. */
:root {
  --bg: #EEF0F3;
  --surface: #F9FAFB;
  --surface-2: #E3E7EC;
  --ink: #161D26;
  --muted: #56606D;
  --line: #C9D0D9;
  --accent: #E7A32A;
  --accent-ink: #1A1405;
  --focus: #2A5BB8;
  --font-display: 'Bricolage Grotesque', 'Avenir Next', 'Segoe UI', sans-serif;
  --font-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-data: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1016; --surface: #141A22; --surface-2: #1D2530; --ink: #E5EAF0; --muted: #98A3B1;
    --line: #2A3441; --accent: #EDB041; --accent-ink: #1A1405; --focus: #8DB3FF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1016; --surface: #141A22; --surface-2: #1D2530; --ink: #E5EAF0; --muted: #98A3B1;
  --line: #2A3441; --accent: #EDB041; --accent-ink: #1A1405; --focus: #8DB3FF;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.45; }
.app {
  display: flex; flex-direction: column; gap: 10px; padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3 { font-family: var(--font-display); letter-spacing: -0.02em; margin: 0; }
h1 { font-size: 21px; font-weight: 800; line-height: 1.1; white-space: nowrap; }
h2 { font-size: 22px; font-weight: 800; line-height: 1.1; }
h3 { font-size: 15px; font-weight: 700; }
button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.mono { font-family: var(--font-data); font-variant-numeric: tabular-nums; }

.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.picker { display: flex; align-items: center; gap: 8px; flex: 1 1 auto; min-width: 0; }
.picker .lbl { font: 600 11px var(--font-body); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.letters { display: flex; gap: 4px; overflow-x: auto; min-width: 0; }
.letter { flex: 0 0 auto; width: 32px; height: 32px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; font: 700 15px var(--font-display); }
.letter[aria-current="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.run { display: flex; gap: 6px; align-items: center; flex: 0 0 auto; }
.btn { font: 600 13px var(--font-body); padding: 7px 14px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; white-space: nowrap; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; min-width: 96px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { font: 500 12px var(--font-data); padding: 7px 9px; border: 0; background: var(--surface); color: var(--ink); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

.main { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.stage { display: flex; flex-direction: column; gap: 8px; min-width: 0; min-height: 0; }
.dishBox { position: relative; border-radius: 8px; overflow: hidden; background: #CDB98C; aspect-ratio: 1.6; max-width: 100%; display: flex; align-items: center; justify-content: center; transition: background .6s; }
#arena { display: block; width: 100%; height: 100%; }
.clock { position: absolute; top: 8px; left: 8px; padding: 3px 8px; border-radius: 6px; background: rgba(12, 16, 22, 0.8); color: #E6EEF0; font: 500 13px var(--font-data); font-variant-numeric: tabular-nums; }
.legend { position: absolute; top: 8px; right: 8px; display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 4px 9px; border-radius: 6px; background: rgba(12, 16, 22, 0.8); color: #E6EEF0; font-size: 12px; max-width: calc(100% - 110px); justify-content: flex-end; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.banner { position: absolute; left: 10px; right: 10px; bottom: 10px; margin: 0 auto; max-width: 440px; padding: 8px 12px; border-radius: 7px; text-align: center; font-size: 13.5px; background: rgba(12, 16, 22, 0.88); color: #E6EEF0; pointer-events: none; }
.chartPanel { display: flex; flex-direction: column; gap: 5px; min-height: 0; }
.chartHead { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.tabs button { font: 600 12px var(--font-body); padding: 5px 10px; border: 0; background: var(--surface); color: var(--ink); cursor: pointer; }
.tabs button + button { border-left: 1px solid var(--line); }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.chartHead .note { font-size: 12px; color: var(--muted); }
.chartBox { position: relative; height: 190px; border-radius: 8px; overflow: hidden; background: #E9EDF1; }
#chart { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.side { display: flex; flex-direction: column; gap: 11px; min-width: 0; min-height: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.setup { margin: 4px 0 0; font-size: 14px; }
.sec { display: flex; flex-direction: column; gap: 6px; }
.secT { font: 600 11px var(--font-body); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin: 0; }
dl.cond { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 5px 12px; font-size: 13px; }
dl.cond dt { font-weight: 600; color: var(--muted); }
dl.cond dd { margin: 0; display: flex; flex-direction: column; gap: 2px; }
.dim { color: var(--muted); }
.sw { display: inline-block; width: 11px; height: 11px; border-radius: 3px; border: 1px solid rgba(0,0,0,.35); vertical-align: -1px; margin-right: 6px; flex: 0 0 auto; }
hr.rule { border: 0; border-top: 1px solid var(--line); margin: 0; }
.prog { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: var(--accent); }
.timeRow { display: flex; justify-content: space-between; font-size: 12.5px; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th { text-align: right; font: 600 10.5px var(--font-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 0 4px 4px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child { text-align: left; }
td { padding: 4px; border-bottom: 1px solid var(--line); vertical-align: middle; }
td.num { text-align: right; font-family: var(--font-data); font-variant-numeric: tabular-nums; }
td.pct { font-weight: 600; }
td.v { white-space: nowrap; font-weight: 600; }
tr.tot td { font-weight: 600; border-bottom: 0; }
.ico { flex: 0 0 auto; }

@media (min-width: 760px) and (min-height: 520px) {
  .app { height: 100%; overflow: hidden; }
  .main { flex: 1 1 auto; display: grid; grid-template-columns: minmax(0, 1fr) clamp(300px, 30vw, 380px); }
  .dishBox { flex: 1 1 60%; aspect-ratio: auto; min-height: 0; }
  .chartPanel { flex: 1 1 40%; min-height: 130px; max-height: 270px; }
  .chartBox { flex: 1 1 auto; height: auto; min-height: 0; }
  #arena { position: absolute; width: auto; height: auto; }
  .side { overflow-y: auto; }
}
@media (min-width: 760px) and (max-height: 740px) { .side { gap: 8px; padding-block: 10px; } .chartPanel { flex-basis: 36%; } }
@media (prefers-reduced-motion: reduce) { .dishBox { transition: none; } }
</style>

<div class="app">
  <header class="top">
    <h1>Trait Tracker</h1>
    <div class="picker">
      <span class="lbl" id="scLbl">Scenario</span>
      <nav class="letters" id="letters" aria-labelledby="scLbl"></nav>
    </div>
    <div class="run">
      <button type="button" class="btn primary" id="play">Play</button>
      <button type="button" class="btn" id="replay">Replay</button>
      <div class="seg" role="group" aria-label="Simulation speed" id="speed">
        <button type="button" data-speed="1" aria-pressed="false">1×</button>
        <button type="button" data-speed="2" aria-pressed="true">2×</button>
        <button type="button" data-speed="4" aria-pressed="false">4×</button>
        <button type="button" data-speed="8" aria-pressed="false">8×</button>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="stage">
      <div class="dishBox" id="dishBox">
        <canvas id="arena" role="img" aria-label="The population in its environment. Each creature shows its own coat color, jaw size, leg length and tail pattern."></canvas>
        <div class="clock" id="clock">Generation 0</div>
        <div class="legend" id="legend"></div>
        <p class="banner" id="banner"></p>
      </div>
      <section class="chartPanel" aria-label="Trait frequency graph">
        <div class="chartHead">
          <div class="tabs" role="group" aria-label="Trait to graph" id="tabs"></div>
          <span class="note">Percent of the population with each variant, by generation</span>
        </div>
        <div class="chartBox" id="chartBox"><canvas id="chart" role="img" aria-label="Stacked graph showing the percent of the population with each variant of the selected trait over 15 generations, with the total population as a dashed line."></canvas></div>
      </section>
    </div>

    <aside class="side" aria-label="Scenario conditions and data">
      <div>
        <h2 id="scTitle"></h2>
        <p class="setup" id="scSetup"></p>
      </div>
      <section class="sec">
        <h3 class="secT">Conditions</h3>
        <dl class="cond" id="cond"></dl>
      </section>
      <hr class="rule">
      <section class="sec">
        <h3 class="secT" id="dataT">Data</h3>
        <div class="timeRow"><span>Generation</span><span class="mono" id="genTxt"></span></div>
        <div class="prog" aria-hidden="true"><i id="progBar"></i></div>
        <table>
          <thead><tr><th>Variant</th><th>Alive</th><th>%</th><th>Born</th><th>Eaten</th><th>Starved</th></tr></thead>
          <tbody id="dataBody"></tbody>
        </table>
      </section>
    </aside>
  </main>
</div>

<script>
(function () {
'use strict';

/* ============ TRAIT TRACKER ENGINE (no DOM) ============ */
var W = 960, H = 600, GEN = 20, GENS = 15;
var TRAITS = {
  coat:   { label: 'Coat color',   variants: ['sandy', 'medium', 'dark'], names: { sandy: 'Sandy', medium: 'Medium brown', dark: 'Dark' } },
  jaw:    { label: 'Jaw size',     variants: ['small', 'large'],          names: { small: 'Small jaw', large: 'Large jaw' } },
  legs:   { label: 'Leg length',   variants: ['short', 'long'],           names: { short: 'Short legs', long: 'Long legs' } },
  stripe: { label: 'Tail pattern', variants: ['plain', 'striped'],        names: { plain: 'Plain tail', striped: 'Striped tail' } }
};
var GROUND = { sand: { name: 'Light sand' }, ash: { name: 'Dark volcanic ash' } };
var FOOD = { soft: { name: 'Soft seeds', energy: 24 }, hard: { name: 'Hard nuts', energy: 30 } };
var CAMO = { sand: { sandy: 0.6, medium: 0.3, dark: -0.05 }, ash: { sandy: -0.05, medium: 0.3, dark: 0.6 } };
var JAW_EFF = { soft: { small: 1.0, large: 0.85 }, hard: { small: 0.2, large: 1.0 } };
var LEGS = { short: { speed: 42, cost: 0.9, dodge: 0 }, long: { speed: 52, cost: 1.05, dodge: 0.5 } };
var HAWK = { speed: 56, lunge: 92, lungeR: 70, lungeMax: 2.4, tired: 1.8, wander: 40, sense: 170, strike: 11, restKill: 3.4, turn: 5 };
var CELL = 64, CAP_FOOD = 150, CAP_CREATURES = 260, FLOOR = 6;
var EAT_R = 11, REPRO_E = 75, REPRO_COST = 50, CHILD_E = 40, MAX_E = 120, MATURE = 8, WALL = 14, VISION = 80, HANDLE = 0.3;

function mulberry32(a) {
  return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function pickMix(rng, mix) {
  var u = rng(), acc = 0, k;
  for (k in mix) { acc += mix[k]; if (u < acc) return k; }
  return k;
}
function upkeepOf(c) { var L = LEGS[c.genes.legs]; return (1.6 + 0.0006 * L.speed * L.speed) * L.cost; }

/* sc: scenario config. */
function createSim(sc) {
  var rng = mulberry32(sc.seed);
  var g = { t: 0, creatures: [], hawks: [], food: [], events: [], ground: sc.ground, growth: { soft: sc.seeds.soft, hard: sc.seeds.hard },
            acc: { soft: 0, hard: 0 }, mutRate: sc.mut || 0, evIdx: 0, stats: {} , mutants: 0 };
  Object.keys(TRAITS).forEach(function (tr) { TRAITS[tr].variants.forEach(function (v) { g.stats[tr + ':' + v] = { born: 0, eaten: 0, starved: 0, old: 0 }; }); });
  var cols = Math.ceil(W / CELL), rows = Math.ceil(H / CELL), grid = [];

  function spawnFood(type) { g.food.push({ type: type, x: 12 + rng() * (W - 24), y: 12 + rng() * (H - 24), rot: rng() * 3.14, dead: false }); }
  function foodCount(type) { var n = 0; for (var i = 0; i < g.food.length; i++) if (g.food[i].type === type && !g.food[i].dead) n++; return n; }
  function ev(kind, c) { if (g.events.length < 200) g.events.push({ kind: kind, x: c.x, y: c.y, genes: c.genes }); }
  function make(genes, x, y, e, age) {
    return { genes: genes, x: x, y: y, a: rng() * 6.283, e: e, age: age, life: 80 + rng() * 40, tgt: null, search: rng() * 0.3, handle: 0, flee: 0, dead: null, mutant: false };
  }
  function addHawk() { g.hawks.push({ x: rng() * W, y: rng() * H, a: rng() * 6.283, rest: 2 + rng() * 2, tgt: null, search: 0, lungeT: 0 }); }
  function tally(c, key) { Object.keys(c.genes).forEach(function (tr) { g.stats[tr + ':' + c.genes[tr]][key]++; }); }

  g.count = function () { return g.creatures.length; };
  g.freq = function (tr) {
    var o = {}; TRAITS[tr].variants.forEach(function (v) { o[v] = 0; });
    g.creatures.forEach(function (c) { o[c.genes[tr]]++; });
    return o;
  };
  g.foodCount = foodCount;
  g.rng = rng;

  // setup
  ['soft', 'hard'].forEach(function (f) { var n = Math.round(g.growth[f] * 8); for (var i = 0; i < n; i++) spawnFood(f); });
  for (var i = 0; i < sc.start.n; i++) {
    var genes = {};
    Object.keys(TRAITS).forEach(function (tr) { genes[tr] = pickMix(rng, sc.start.mix[tr]); });
    g.creatures.push(make(genes, 40 + rng() * (W - 80), 40 + rng() * (H - 80), 50 + rng() * 20, rng() * 50));
  }
  for (var h = 0; h < sc.hawks; h++) addHawk();

  function applyEvent(e) {
    if (e.ground) g.ground = e.ground;
    if (e.seeds) { g.growth = { soft: e.seeds.soft, hard: e.seeds.hard }; }
    if (e.hawks !== undefined) { while (g.hawks.length < e.hawks) addHawk(); g.hawks.length = e.hawks; }
    if (e.mutant) {   // one newborn-sized mutant appears
      for (var k = 0; k < (e.count || 1); k++) {
        var p = g.creatures[(rng() * g.creatures.length) | 0], genes = {};
        for (var t in p.genes) genes[t] = p.genes[t];
        for (t in e.mutant) genes[t] = e.mutant[t];
        var c = make(genes, p.x, p.y, 70, MATURE); c.mutant = true; g.creatures.push(c); g.mutants++;
        ev('mutant', c);
      }
    }
  }
  function buildGrid() {
    grid = new Array(cols * rows);
    for (var i = 0; i < grid.length; i++) grid[i] = [];
    for (i = 0; i < g.food.length; i++) {
      var f = g.food[i]; if (f.dead) continue;
      grid[Math.min(rows - 1, (f.y / CELL) | 0) * cols + Math.min(cols - 1, (f.x / CELL) | 0)].push(f);
    }
  }
  function bestFood(c) {
    var best = null, bs = 0, r = Math.ceil(VISION / CELL), v2 = VISION * VISION;
    var cx = Math.min(cols - 1, Math.max(0, (c.x / CELL) | 0)), cy = Math.min(rows - 1, Math.max(0, (c.y / CELL) | 0));
    for (var gy = Math.max(0, cy - r); gy <= Math.min(rows - 1, cy + r); gy++) {
      for (var gx = Math.max(0, cx - r); gx <= Math.min(cols - 1, cx + r); gx++) {
        var cell = grid[gy * cols + gx];
        for (var i = 0; i < cell.length; i++) {
          var f = cell[i]; if (f.dead) continue;
          var dx = f.x - c.x, dy = f.y - c.y, d2 = dx * dx + dy * dy; if (d2 > v2) continue;
          var sc2 = JAW_EFF[f.type][c.genes.jaw] / (Math.sqrt(d2) + 25);
          if (sc2 > bs) { bs = sc2; best = f; }
        }
      }
    }
    return best;
  }
  function turnToward(o, want, maxTurn) {
    var d = want - o.a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI;
    o.a += Math.max(-maxTurn, Math.min(maxTurn, d));
  }
  function bounce(o) {
    if (o.x < WALL) { o.x = WALL; o.a = Math.PI - o.a; }
    if (o.x > W - WALL) { o.x = W - WALL; o.a = Math.PI - o.a; }
    if (o.y < WALL) { o.y = WALL; o.a = -o.a; }
    if (o.y > H - WALL) { o.y = H - WALL; o.a = -o.a; }
  }
  function camo(c) { return CAMO[g.ground][c.genes.coat]; }

  g.step = function (dt) {
    while (g.evIdx < sc.events.length && g.t >= sc.events[g.evIdx].gen * GEN - 1e-9) applyEvent(sc.events[g.evIdx++]);
    ['soft', 'hard'].forEach(function (type) {
      g.acc[type] += g.growth[type] * dt;
      while (g.acc[type] >= 1) { g.acc[type] -= 1; if (foodCount(type) < CAP_FOOD) spawnFood(type); }
    });
    buildGrid();
    var safe = g.creatures.length <= FLOOR;

    g.hawks.forEach(function (p) {
      if (p.rest > 0) { p.rest -= dt; p.tgt = null; p.a += (rng() - 0.5) * 2 * dt; p.x += Math.cos(p.a) * 8 * dt; p.y += Math.sin(p.a) * 8 * dt; bounce(p); return; }
      if (p.tgt && (p.tgt.dead || safe)) p.tgt = null;
      if (p.tgt) {
        var t = p.tgt, dx = t.x - p.x, dy = t.y - p.y;
        var range = HAWK.sense * (1 - camo(t));
        if (dx * dx + dy * dy > range * range * 2.56) { p.tgt = null; p.lungeT = 0; }
      }
      p.search -= dt;
      if (!p.tgt && p.search <= 0 && !safe) {
        p.search = 0.3;
        var best = null, bd = 1e9;
        for (var i = 0; i < g.creatures.length; i++) {
          var c = g.creatures[i]; if (c.dead) continue;
          var r = HAWK.sense * (1 - camo(c)), ddx = c.x - p.x, ddy = c.y - p.y, dd = ddx * ddx + ddy * ddy;
          if (dd < r * r && dd < bd) { bd = dd; best = c; }
        }
        p.tgt = best; p.lungeT = 0;
      }
      if (p.tgt) {
        var tg = p.tgt, ex = tg.x - p.x, ey = tg.y - p.y, de = Math.sqrt(ex * ex + ey * ey);
        turnToward(p, Math.atan2(ey, ex), HAWK.turn * dt);
        var v = HAWK.speed;
        if (de < HAWK.lungeR) { v = HAWK.lunge; p.lungeT += dt; }
        if (p.lungeT > HAWK.lungeMax) { p.rest = HAWK.tired; p.lungeT = 0; p.tgt = null; return; }
        p.x += Math.cos(p.a) * v * dt; p.y += Math.sin(p.a) * v * dt; bounce(p);
        if (de < HAWK.strike) {
          if (rng() < LEGS[tg.genes.legs].dodge) { tg.flee = 1.2; p.rest = 1.2; ev('escape', tg); }
          else { tg.dead = 'eaten'; p.rest = HAWK.restKill; }
          p.tgt = null; p.lungeT = 0;
        }
      } else { p.a += (rng() - 0.5) * 6 * dt; p.x += Math.cos(p.a) * HAWK.wander * dt; p.y += Math.sin(p.a) * HAWK.wander * dt; bounce(p); }
    });

    var list = g.creatures, n = list.length, born = [];
    var start = n ? (rng() * n) | 0 : 0;
    for (var k = 0; k < n; k++) {
      var c = list[(start + k) % n];
      if (c.dead) continue;
      var L = LEGS[c.genes.legs];
      c.age += dt;

  var L = 42, R = 44, T = 12, B = 22, pw = VW - L - R, ph = VH - T - B;
  if (pw < 20 || ph < 20) return;
  cctx.font = MONO; cctx.textBaseline = 'middle';
  function X(g) { return L + g / GENS * pw; }
  function Y(p) { return T + ph - p / 100 * ph; }
  // stacked areas
  if (history.length > 1) {
    var base = history.map(function () { return 0; });
    vars.forEach(function (v) {
      var top = history.map(function (h, i) { return base[i] + (h.n ? 100 * h.f[view][v] / h.n : 0); });
      cctx.beginPath();
      history.forEach(function (h, i) { var x = X(h.gen), y = Y(top[i]); if (i === 0) cctx.moveTo(x, y); else cctx.lineTo(x, y); });
      for (var i = history.length - 1; i >= 0; i--) cctx.lineTo(X(history[i].gen), Y(base[i]));
      cctx.closePath(); cctx.fillStyle = VCOL[view][v]; cctx.fill();
      cctx.strokeStyle = 'rgba(255,255,255,0.8)'; cctx.lineWidth = 1; cctx.stroke();
      base = top;
    });
  }
  // grid and labels
  cctx.strokeStyle = 'rgba(22,29,38,0.18)'; cctx.lineWidth = 1; cctx.fillStyle = '#3A4450'; cctx.textAlign = 'right';
  [0, 25, 50, 75, 100].forEach(function (p) {
    cctx.beginPath(); cctx.moveTo(L, Math.round(Y(p)) + 0.5); cctx.lineTo(L + pw, Math.round(Y(p)) + 0.5); cctx.stroke();
    cctx.fillText(p + '%', L - 6, Y(p));
  });
  cctx.textAlign = 'center';
  for (var gx = 0; gx <= GENS; gx++) {
    if (gx % (pw < 360 ? 3 : 1) === 0) cctx.fillText(String(gx), X(gx), VH - 10);
  }
  // event markers
  sc.events.forEach(function (e) {
    var mx = Math.round(X(e.gen)) + 0.5;
    cctx.save(); cctx.setLineDash([4, 3]); cctx.strokeStyle = '#161D26'; cctx.lineWidth = 1.4;
    cctx.beginPath(); cctx.moveTo(mx, T); cctx.lineTo(mx, T + ph); cctx.stroke(); cctx.restore();
    cctx.fillStyle = '#161D26'; cctx.textAlign = 'left'; cctx.fillText('Event', mx + 4, T + 8);
  });
  // population line on the right axis
  var maxN = 20; history.forEach(function (h) { maxN = Math.max(maxN, h.n); });
  maxN = Math.ceil(maxN / 20) * 20;
  cctx.save(); cctx.setLineDash([5, 4]); cctx.strokeStyle = '#161D26'; cctx.lineWidth = 1.6; cctx.beginPath();
  history.forEach(function (h, i) { var x = X(h.gen), y = T + ph - h.n / maxN * ph; if (i === 0) cctx.moveTo(x, y); else cctx.lineTo(x, y); });
  cctx.stroke(); cctx.restore();
  cctx.fillStyle = '#161D26'; cctx.textAlign = 'left';
  cctx.fillText(String(maxN), L + pw + 6, T + 4); cctx.fillText('0', L + pw + 6, T + ph);
  cctx.save(); cctx.translate(VW - 8, T + ph / 2); cctx.rotate(-Math.PI / 2); cctx.textAlign = 'center'; cctx.fillText('- - population', 0, 0); cctx.restore();
}

/* ---------- controls ---------- */
var letters = $('letters');
SCENARIOS.forEach(function (s, i) {
  var b = document.createElement('button');
  b.type = 'button'; b.className = 'letter'; b.textContent = s.id.toUpperCase();
  b.setAttribute('aria-label', 'Scenario ' + s.id.toUpperCase() + ': ' + s.title);
  b.title = s.title;
  b.addEventListener('click', function () { if (location.hash !== '#scenario-' + s.id) location.hash = '#scenario-' + s.id; load(i); });
  letters.appendChild(b);
});
function fromHash() {
  var m = /^#scenario-([a-z])$/.exec(location.hash || ''); if (!m) return 0;
  for (var i = 0; i < SCENARIOS.length; i++) if (SCENARIOS[i].id === m[1]) return i;
  return 0;
}
window.addEventListener('hashchange', function () { var i = fromHash(); if (i !== cur) load(i); });
$('play').addEventListener('click', function () { if (!done) { running = !running; refresh(); } });
$('replay').addEventListener('click', function () { load(cur); running = true; refresh(); });
$('speed').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  speed = parseInt(b.dataset.speed, 10);
  var all = $('speed').children;
  for (var i = 0; i < all.length; i++) all[i].setAttribute('aria-pressed', String(all[i] === b));

/* ---------- loop ---------- */
var lastTs = 0, acc = 0, uiAcc = 0, chAcc = 0, lastGround = null;
function frame(ts) {
  var dtReal = Math.min(0.1, (ts - lastTs) / 1000); lastTs = ts;
  if (running) {
    acc += dtReal * speed;
    var steps = 0;
    while (acc >= DT && steps < 30 && running) {
      sim.step(DT); acc -= DT; steps++;
      if (Math.floor(sim.t + 1e-9) > lastRec) { lastRec = Math.floor(sim.t + 1e-9); record(); }
      if (sim.t >= GENS * GEN - 1e-9) { running = false; done = true; record(); refresh(); }
    }
    if (steps >= 30) acc = 0;
    if (lastGround !== sim.ground) { lastGround = sim.ground; $('dishBox').style.background = GROUND_COL[sim.ground]; }
  }
  stepFx(dtReal);
  drawArena();
  chAcc += dtReal; if (chAcc > 0.15) { chAcc = 0; drawChart(); }
  uiAcc += dtReal; if (uiAcc > 0.25) { uiAcc = 0; updateData(); if (sim.t > 0 && !done) $('banner').hidden = true; }
  requestAnimationFrame(frame);
}
function onResize() { fitCanvases(); drawArena(); drawChart(); }
if (window.ResizeObserver) { new ResizeObserver(onResize).observe(dishBox); new ResizeObserver(onResize).observe(chartBox); }
else window.addEventListener('resize', onResize);
fitCanvases();
load(fromHash());
window.__tt = function () { return { done: done, t: sim.t }; };
requestAnimationFrame(function (ts) { lastTs = ts; requestAnimationFrame(frame); });
})();
</script>
